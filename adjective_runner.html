function sound(freq=440,duration=.08,kind='sine',volume=.045){if(muted||!audio)return;try{const osc=audio.createOscillator(),g=audio.createGain();osc.type=kind;osc.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(g);g.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration+.02)}catch(_){}}

function menu(){state='MENU';phase='main';updateButtons();setScreen(`<div class="mini-label">МИНИ-ИГРА · 6 КЛАСС</div><h1>Забег по<br>разрядам</h1><p class="lead">Три дорожки. Три разряда прилагательных. Сам управляй персонажем и успевай выбрать верный маршрут!</p><div class="intro-lanes"><div class="intro-lane quality"><b>← Качественные</b><small>Свойство, качество</small></div><div class="intro-lane relative"><b>↑ Относительные</b><small>Материал, время, назначение</small></div><div class="intro-lane possessive"><b>→ Притяжательные</b><small>Принадлежность</small></div></div><div class="modepick"><div><b>Спокойный режим</b><small>У ворот можно подумать и нажать «Готово»</small></div><button class="switch ${calm?'on':''}" id="calmSwitch" role="switch" aria-checked="${calm}" aria-label="Спокойный режим"></button></div><div class="controls-guide"><span><b class="key">←</b><b class="key">→</b>смена дорожки</span><span><b class="key">↑</b> прыжок</span><span><b class="key">P</b> пауза</span></div><button class="primary" id="playBtn">НАЧАТЬ ЗАБЕГ&nbsp; ↗</button><p class="footer-tip">34 словосочетания · 3 уровня · работа над ошибками · без интернета</p>`);$('calmSwitch').addEventListener('click',()=>{calm=!calm;const el=$('calmSwitch');el.classList.toggle('on',calm);el.setAttribute('aria-checked',String(calm))});$('playBtn').addEventListener('click',startGame)}
function startGame(){audioInit();mainIndex=0;rnoIndex=0;rnoList=[];phase='main';hearts=3;score=0;coins=0;combo=0;mainCorrect=0;rnoCorrect=0;errors=[];for(const k of Object.keys(track))track[k]={hit:0,total:0};playerLane=1;playerVisual=1;animationClock=0;worldScroll=0;particles=[];hideScreen();startQuestion();chime()}
function getCurrentQuestion(){return phase==='main'?questions[mainIndex]:rnoList[rnoIndex]}
function startQuestion(){current=getCurrentQuestion();if(!current){finish();return}gateDist=1;state='RUN';runClock=0;animHold=0;jumpClock=0;successJumpBonus=false;toaster=0;toastEl.classList.remove('visible');$('coach').classList.add('hidden');updatePrompt();updateHud()}
function highlightPhrase(q){let p=q.phrase,a=q.adjective,i=p.toLocaleLowerCase('ru').indexOf(a.toLocaleLowerCase('ru'));return i<0?escapeHtml(p):escapeHtml(p.slice(0,i))+'<mark>'+escapeHtml(p.slice(i,i+a.length))+'</mark>'+escapeHtml(p.slice(i+a.length))}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function updatePrompt(){$('phrase').innerHTML=highlightPhrase(current);$('promptLabel').textContent=phase==='main'?`УРОВЕНЬ ${current.level} · ${LEVEL_NAMES[current.level].toUpperCase()}`:'РНО · ПОВТОРЯЕМ СЛОЖНОЕ';$('promptHint').textContent=calm?'Перестройся стрелками. У ворот нажми «Готово».':'Перестройся стрелками до контрольных ворот.'}
function updateHud(){if(!current)return;$('levelStat').innerHTML=phase==='main'?`Этап <strong>${current.level}/3</strong>`:'<strong>РНО</strong>';$('questionStat').innerHTML=phase==='main'?`Слово <strong>${mainIndex+1}/${questions.length}</strong>`:`Повтор <strong>${rnoIndex+1}/${rnoList.length}</strong>`;$('heartsStat').textContent='♥ '.repeat(hearts)+'♡ '.repeat(3-hearts);$('scoreStat').innerHTML='<span class="ico">✦</span><strong>'+score+'</strong>';$('coinsStat').innerHTML='<span class="ico">●</span><strong>'+coins+'</strong>';$('progressFill').style.width=phase==='main'?(mainIndex/questions.length*100)+'%':(rnoIndex/Math.max(1,rnoList.length)*100)+'%';document.querySelectorAll('.lane-pill').forEach((el,i)=>el.classList.toggle('active',playerLane===i));updateButtons()}
function moveLane(dir){if(!['RUN','SAFE_WAIT'].includes(state))return;const was=playerLane;playerLane=Math.max(0,Math.min(2,playerLane+dir));if(playerLane!==was){sound(270+playerLane*110,.075,'triangle',.035);updateHud()}}
function jump(){if(!['RUN','SAFE_WAIT','SUCCESS'].includes(state))return;if(jumpClock>0)return;jumpClock=.74;sound(380,.1,'triangle',.025);if(state==='SUCCESS'&&!successJumpBonus){successJumpBonus=true;coins++;score+=10;sound(900,.12,'sine');updateHud()}}
function showToast(text,wrong=false){toastEl.textContent=text;toastEl.classList.remove('wrong');if(wrong)toastEl.classList.add('wrong');toastEl.classList.add('visible');toaster=1.7}
function commit(){if(!['RUN','SAFE_WAIT'].includes(state))return;const right=playerLane===LANE_BY_TYPE[current.type];const selected=LANES[playerLane].name,correct=LANES[LANE_BY_TYPE[current.type]].name;gateDist=0;if(phase==='main'){track[current.type].total++;if(right){track[current.type].hit++;mainCorrect++}}else if(right)rnoCorrect++;
 if(right){score+=100;combo++;if(combo%3===0)score+=25;coins++;state='SUCCESS';animHold=0;sound(580,.10,'triangle');chime();showToast(`${correct}: ${current.reason}`);burst(W*.5,H*.72,LANES[playerLane].color,28)}else{combo=0;hearts--;sound(190,.24,'sawtooth',.04);burst(W*.5,H*.72,'#f9909b',13);wrongInfo={chosen:selected,correct,reason:current.reason,question:current};if(phase==='main')errors.push({questionId:current.id,type:current.type,chosenType:LANES[playerLane].id,tag:current.tag,reason:current.reason,level:current.level,phrase:current.phrase});afterWrongPit=hearts===0;state='WRONG';showWrong()}
 updateHud()}
function showWrong(){const x=wrongInfo;setScreen(`<div class="mini-label">${phase==='main'?'РАЗБОР ОШИБКИ':'РНО · РАЗБОР'}</div><h2>Дорожка оказалась не той</h2><p class="lead" style="margin-bottom:10px"><b style="color:white">«${escapeHtml(x.question.phrase)}»</b></p><div class="answer-line">Ты выбрал: <b>${x.chosen}</b></div><div class="answer-line">Верный разряд: <b style="color:#9fead1">${x.correct}</b></div><div class="answer-reason wrong">${escapeHtml(x.reason)}</div><p class="footer-tip">${afterWrongPit?'Сердца закончились, но забег продолжается: после разбора восстановим их.':'Ошибка попадёт в тренировку РНО после основного забега.'}</p><div class="actionrow"><button class="primary" id="continueBtn">${afterWrongPit?'ПИТ-СТОП · ДАЛЬШЕ':'ПРОДОЛЖИТЬ'} ↵</button></div>`);$('continueBtn').addEventListener('click',continueAfterWrong)}
function continueAfterWrong(){if(state!=='WRONG')return;if(afterWrongPit){hearts=3;afterWrongPit=false;state='PIT';setScreen(`<div class="mini-label">ПИТ-СТОП</div><h2>Сердца восстановлены ♥♥♥</h2><p class="lead">Сложные случаи сохранились. На финише разберём их на новых примерах.</p><button class="primary" id="pitContinue">ВОЗВРАЩАЕМСЯ НА ТРАССУ →</button>`);$('pitContinue').addEventListener('click',()=>{hideScreen();advance()});return}hideScreen();advance()}
function advance(){if(phase==='main'){mainIndex++;if(mainIndex>=questions.length){if(errors.length)rnoIntro();else finish();return}if(questions[mainIndex].level!==questions[mainIndex-1].level){levelDone(questions[mainIndex].level-1);return}}else{rnoIndex++;if(rnoIndex>=rnoList.length){finish();return}}startQuestion()}
function levelDone(completed){state='LEVEL';const title=LEVEL_NAMES[completed],count=questions.filter(q=>q.level===completed).length;setScreen(`<div class="mini-label">УРОВЕНЬ ${completed} ПРОЙДЕН</div><div class="confetti">✦ ✧ ✦</div><h2>${title} — готово!</h2><p class="lead">Преодолены ${count} контрольных ворот. Впереди ${completed===1?'более разнообразные признаки':'слова с переносным значением'}.</p><div class="statsgrid"><div class="statbox"><strong>${mainCorrect}/${mainIndex}</strong><small>Верных в забеге</small></div><div class="statbox"><strong>${score}</strong><small>Очков заработано</small></div></div><button class="primary" id="nextLevelBtn">УРОВЕНЬ ${completed+1} →</button>`);$('nextLevelBtn').addEventListener('click',()=>{hideScreen();startQuestion()})}
function prepareRno(){const pool=BANK.rno;const picked=[],used=new Set();const prioritized=[];const seen=new Set();for(const error of errors){if(!seen.has(error.tag)){prioritized.push(error);seen.add(error.tag)}}for(const error of errors)if(!prioritized.includes(error))prioritized.push(error);
 for(const e of prioritized.slice(0,12)){let item=pool.find(x=>x.tag===e.tag&&!used.has(x.id));if(!item)item=pool.find(x=>x.type===e.type&&!used.has(x.id));if(item){used.add(item.id);picked.push({...item,fromTag:e.tag})}else{const orig=questions.find(q=>q.id===e.questionId);if(orig)picked.push({...orig,id:'RE-'+picked.length,fromTag:e.tag})}}return picked}
function rnoIntro(){rnoList=prepareRno();rnoIndex=0;state='RNO_INTRO';setScreen(`<div class="mini-label">ЭТАП 4 · РАБОТА НАД ОШИБКАМИ</div><h2>Вторая попытка</h2><p class="lead">В основном забеге было ${errors.length} ${wordForm(errors.length,'ошибка','ошибки','ошибок')}. Теперь проверим сложные разряды на <b style="color:white">новых словосочетаниях</b>. Управление то же!</p><div class="statsgrid"><div class="statbox"><strong>${errors.length}</strong><small>Ошибок для разбора</small></div><div class="statbox"><strong>${rnoList.length}</strong><small>Заданий РНО</small></div></div><button class="primary" id="rnoBtn">ПРОЙТИ РНО →</button>`);$('rnoBtn').addEventListener('click',()=>{phase='rno';hideScreen();startQuestion()})}
function wordForm(n,a,b,c){const x=n%10,y=n%100;return(y>=11&&y<=14)?c:x===1?a:[2,3,4].includes(x)?b:c}
function finish(){state='FINISH';if(score>best){best=score;try{localStorage.setItem('runner_adjective_best',String(best))}catch(_){}}const pct=Math.round(100*mainCorrect/questions.length);const rnoText=errors.length?`<div class="score-line"><span>РНО: исправлено при повторе</span><b>${rnoCorrect} из ${rnoList.length}</b></div>`:'<div class="score-line"><span>РНО</span><b>Не потребовалось 🎯</b></div>';setScreen(`<div class="mini-label">ФИНИШНАЯ ЧЕРТА</div><div class="confetti">✦ ✧ ✦</div><h2>Забег завершён!</h2><p class="lead">Важны не только очки, но и понимание разрядов. Вот твои результаты:</p><div class="statsgrid"><div class="statbox"><strong>${mainCorrect}/34</strong><small>Верно в основном забеге · ${pct}%</small></div><div class="statbox"><strong>${score}</strong><small>Очки · рекорд ${best}</small></div></div><div class="score-lines">${LANES.map(l=>`<div class="score-line"><span style="color:${l.color}">●</span><span style="flex:1">${l.name}</span><b>${track[l.id].hit} / ${track[l.id].total}</b></div>`).join('')}<div class="score-line"><span>Ошибки основного забега</span><b>${errors.length}</b></div>${rnoText}<div class="score-line"><span>Монетки</span><b>${coins}</b></div></div><div class="actionrow">${errors.length?'<button class="secondary" id="repeatRno">ЕЩЁ РАЗ СЛОЖНОЕ</button>':''}<button class="primary" id="restartBtn">ИГРАТЬ СНОВА ↗</button></div>`);$('restartBtn').addEventListener('click',startGame);if(errors.length)$('repeatRno').addEventListener('click',()=>{phase='rno';rnoIndex=0;hearts=3;rnoCorrect=0;rnoList=prepareRno();hideScreen();startQuestion()})}
function togglePause(){if(state==='PAUSE'){state=previousState;hideScreen();updateButtons();return}if(!['RUN','SAFE_WAIT','SUCCESS'].includes(state))return;previousState=state;state='PAUSE';setScreen(`<div class="mini-label">ПАУЗА</div><h2>Небольшая остановка</h2><p class="lead">Отдохни или вспомни признаки разрядов. За это время персонаж никуда не убежит.</p><div class="intro-lanes"><div class="intro-lane quality"><b>Качественные</b><small>Какой по свойству?</small></div><div class="intro-lane relative"><b>Относительные</b><small>Из чего? Когда? Для чего?</small></div><div class="intro-lane possessive"><b>Притяжательные</b><small>Чей?</small></div></div><div class="actionrow"><button class="primary" id="resumeBtn">ПРОДОЛЖИТЬ ↵</button><button class="secondary" id="exitBtn">В МЕНЮ</button></div>`);$('resumeBtn').addEventListener('click',togglePause);$('exitBtn').addEventListener('click',menu);updateButtons()}

function keyHandler(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Escape'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))e.preventDefault();if(e.repeat&&['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))return;switch(e.key){case 'ArrowLeft':case 'a':case 'A':moveLane(-1);break;case 'ArrowRight':case 'd':case 'D':moveLane(1);break;case 'ArrowUp':case ' ':if(state==='WRONG'){continueAfterWrong()}else if(state==='RUN'||state==='SAFE_WAIT'||state==='SUCCESS')jump();else if(state==='PAUSE'&&e.key===' ')togglePause();break;case 'Enter':if(state==='SAFE_WAIT')onReady();else if(state==='WRONG')continueAfterWrong();else if(state==='PAUSE')togglePause();else if(state==='LEVEL')$('nextLevelBtn')?.click();else if(state==='RNO_INTRO')$('rnoBtn')?.click();else if(state==='MENU')$('playBtn')?.click();break;case 'Escape':case 'p':case 'P':togglePause();break;case 'm':case 'M':muted=!muted;updateButtons();break}}
window.addEventListener('keydown',keyHandler);
$('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(-1)});$('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(1)});$('readyBtn').addEventListener('click',onReady);$('pauseBtn').addEventListener('click',togglePause);$('soundBtn').addEventListener('click',()=>{muted=!muted;if(!muted)audioInit();updateButtons()});
let touchX=null,touchY=null;canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){touchX=e.clientX;touchY=e.clientY}});canvas.addEventListener('pointerup',e=>{if(touchX===null)return;const dx=e.clientX-touchX,dy=e.clientY-touchY;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);else if(dy< -40)jump();touchX=null;touchY=null});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['RUN','SAFE_WAIT','SUCCESS'].includes(state))togglePause()});
function path(points,fill,stroke,lineWidth=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lineWidth;ctx.strokeStyle=stroke;ctx.stroke()}}
function roundedRect(x,y,w,h,r,fill,stroke=null){if(w<=0||h<=0)return;ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function mix(a,b,t){return a+(b-a)*t}
function roadHalf(y){const t=Math.max(0,Math.min(1,(y-H*.30)/(H*.73)));return mix(Math.min(55,W*.115),Math.min(W*.48,490),Math.pow(t,.86))}
function centerX(){return W*.50}
function laneX(l,y){return centerX()+(l-1)*(roadHalf(y)*2/3)}
function worldY(depth){return H*.30+Math.pow(Math.max(0,Math.min(1,depth)),1.45)*(H*.85-H*.30)}
function background(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#42577a');sky.addColorStop(.43,'#8ba7bd');sky.addColorStop(.68,'#7b99a9');sky.addColorStop(1,'#385d75');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const sunX=W*.70,sunY=H*.22;const glow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,W*.32);glow.addColorStop(0,'#ffdeab66');glow.addColorStop(1,'#ffdeab00');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.62);ellipse(sunX,sunY,Math.min(34,W*.055),Math.min(34,W*.055),'#ffe2be');const s=Math.max(.4,W/1100);ctx.save();ctx.fillStyle='#496d89';for(let i=0;i<19;i++){let x=(i*101 + 17)% (W+120)-40;const tall=(75+(i*37)%120)*s,y=H*.34-tall;roundedRect(x,y,64*s,tall+H*.11,3,'#4a6f8a');if(i%2===0)for(let j=0;j<4;j++)for(let k=0;k<3;k++)roundedRect(x+9*s+k*17*s,y+12*s+j*23*s,6*s,8*s,1,'#f7e1b35b')}ctx.restore();const mist=ctx.createLinearGradient(0,H*.26,0,H*.56);mist.addColorStop(0,'#c9d5d009');mist.addColorStop(1,'#c6d7bc84');ctx.fillStyle=mist;ctx.fillRect(0,H*.26,W,H*.3);for(let side of [-1,1]){const left=side<0;path([[0,H*.36],[centerX()+side*roadHalf(H*.34),H*.34],[centerX()+side*roadHalf(H+.01*H),H],[left?0:W,H]],side<0?'#426f65':'#487369')}}
function drawRoad(){const top=H*.30,bottom=H+6,c=centerX(),a=roadHalf(top),b=roadHalf(bottom);
 path([[c-a,top],[c+a,top],[c+b,bottom],[c-b,bottom]],'#223c54','#b2d3d856',2);
 for(let l=0;l<3;l++){const x0=c-a+2*a*l/3,x1=c-a+2*a*(l+1)/3;const z0=c-b+2*b*l/3,z1=c-b+2*b*(l+1)/3;path([[x0,top],[x1,top],[z1,bottom],[z0,bottom]],["#26766731","#4d97e92a","#e77b672b"][l])}
 for(let boundary of [-1/3,1/3]){const xx=c+boundary*a,xb=c+boundary*b;ctx.strokeStyle='#d6eff2ad';ctx.lineWidth=Math.max(2,W/450);ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xb,bottom);ctx.stroke()}
 const speed=worldScroll%1;for(let row=0;row<16;row++){let depth=((row/16+speed/10)%1);let y=worldY(depth),h=3+depth*17,w=2+depth*5;for(let j=0;j<3;j++){const x=laneX(j,y);roundedRect(x-w/2,y,w,h,2,'#cce2e558')}}
 for(let side of [-1,1]){for(let i=0;i<7;i++){const depth=(i/7+worldScroll/13)%1,y=worldY(depth);if(y<H*.32)continue;const edge=c+side*roadHalf(y)*1.11;const size=3+depth*11;ellipse(edge,y,size/2,size/3,'#d4e9df66');ctx.strokeStyle='#2c6456';ctx.lineWidth=2+depth*3;ctx.beginPath();ctx.moveTo(edge,y);ctx.lineTo(edge,y-(10+depth*56));ctx.stroke();ellipse(edge,y-(12+depth*59),4+depth*10,5+depth*13,depth>.4?'#ffce8c':'#f7dcaf')}}}
function drawGate(){if(!current||['MENU','FINISH'].includes(state))return;const depth=Math.min(1,Math.max(.02,1-Math.max(0,gateDist)));const y=worldY(depth);if(y>H*.94)return;const sc=.22+depth*1.25;const poleH=80*sc+10,poleW=(5+8*sc)*Math.min(1,W/620),gateWidth=130*sc*Math.min(1,W/650);for(let i=0;i<3;i++){const x=laneX(i,y),color=LANES[i].color,selected=playerLane===i,opened=state==='SUCCESS'&&i===LANE_BY_TYPE[current.type],isWrong=state==='WRONG'&&playerLane===i;
 ellipse(x,y+7,gateWidth*.6,5*sc,'#030d1875');ctx.shadowBlur=selected?22*sc:5*sc;ctx.shadowColor=color;roundedRect(x-gateWidth*.46,y-poleH,poleW,poleH,4,color);roundedRect(x+gateWidth*.46-poleW,y-poleH,poleW,poleH,4,color);roundedRect(x-gateWidth*.49,y-poleH-16*sc,gateWidth*.98,18*sc+6,6,'#102844','#ffffff45');ctx.shadowBlur=0;
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`900 ${Math.max(7,Math.min(14,12*sc*(W<650?.67:1)))}px system-ui`;ctx.fillText(["КАЧЕСТВ.","ОТНОСИТ.","ПРИТЯЖАТ."][i],x,y-poleH-8*sc);ctx.restore();if(depth>.27){const doorW=gateWidth*.40;const doorH=poleH*.61;const lift=opened?Math.min(1,(animHold/.42))*doorW:0;roundedRect(x-gateWidth*.43-lift,y-doorH,doorW,doorH,4,isWrong?'#a34d5d92':'#294f69a0');roundedRect(x+gateWidth*.03+lift,y-doorH,doorW,doorH,4,isWrong?'#a34d5d92':'#294f69a0')}}}
function character(){const y=H*.82, x=laneX(playerVisual,y),scale=Math.min(1.2,Math.max(.75,W/850)),bob=Math.sin(animationClock*13)*(reduced?0:2),j=jumpClock>0?Math.sin(Math.PI*(1-jumpClock/.74))*70:0;ellipse(x,y+8,20*scale*(1-j/190),7*scale,'#0000005f');ctx.save();ctx.translate(x,y-33*scale+bob-j);ctx.scale(scale,scale);
 // Sneakers and moving trousers
 const swing=Math.sin(animationClock*13)*(reduced?0:9);
 ctx.lineCap='round';ctx.strokeStyle='#13253f';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-9,8);ctx.lineTo(-13+swing*.7,31);ctx.moveTo(9,8);ctx.lineTo(12-swing*.7,31);ctx.stroke();roundedRect(-26+swing*.7,24,26,10,5,'#ffffff');roundedRect(1-swing*.7,24,26,10,5,'#ffffff');
 // backpack and arms
 roundedRect(-21,-30,42,42,14,'#0d263f');ctx.strokeStyle='#f0ae83';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-17,-23);ctx.lineTo(-25+Math.sin(animationClock*13)*5,2);ctx.moveTo(17,-23);ctx.lineTo(25-Math.sin(animationClock*13)*5,2);ctx.stroke();
 // hoodie with seam
 roundedRect(-19,-36,38,46,13,'#ffae70');roundedRect(-14,-33,28,10,5,'#e68d64');ctx.lineWidth=2;ctx.strokeStyle='#f5dbb1';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,-8);ctx.stroke();roundedRect(-7,-12,14,9,5,'#fbe4be');
 // head neck hair
 roundedRect(-6,-45,12,12,3,'#dba37d');ellipse(0,-58,16,19,'#e8b08a');ellipse(0,-69,17,9,'#25334b');roundedRect(-17,-70,34,9,5,'#26384d');ellipse(-5,-57,1.5,1.5,'#18283d');ellipse(6,-57,1.5,1.5,'#18283d');ctx.strokeStyle='#9e644d';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(1,-53,4,0,Math.PI);ctx.stroke();
 // turquoise headphones
 ctx.strokeStyle='#77e9d6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-61,16,Math.PI*1.12,Math.PI*1.9);ctx.stroke();roundedRect(-17,-64,5,12,2,'#51d9bb');roundedRect(12,-64,5,12,2,'#51d9bb');ctx.restore()}
function drawCoins(){if(state!=='SUCCESS')return;const t=animHold;if(t>1.1)return;for(let i=0;i<4;i++){const a=t*2.1+i*.7;const cx=laneX(playerLane,H*.6)+(i-1.5)*17,cy=H*.63-t*75+Math.sin(a)*11;ellipse(cx,cy,6+Math.sin(a)*1.8,9,'#ffd276');ellipse(cx-1,cy-1,2,4,'#fff2c4')}}
function burst(x,y,col,n){for(let i=0;i<(reduced?8:n);i++){const t=i/n*Math.PI*2,spd=70+Math.random()*150;particles.push({x,y,vx:Math.cos(t)*spd,vy:Math.sin(t)*spd-100,age:0,dur:.55+Math.random()*.55,color:col,size:3+Math.random()*5})}}
function updateParticles(dt){particles=particles.filter(p=>p.age<p.dur);for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,1-p.age/p.dur);roundedRect(p.x,p.y,p.size,p.size,1,p.color)}ctx.globalAlpha=1}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);background();drawRoad();drawGate();drawCoins();character();drawParticles()}
let prev=performance.now();function tick(now){let dt=Math.max(0,Math.min(.06,(now-prev)/1000));prev=now;animationClock+=dt*(state==='PAUSE'?0:1);const active=['RUN','SAFE_WAIT','SUCCESS'].includes(state);if(active){worldScroll+=dt*(state==='RUN'?(current?.level||1)*.4+1.15:.28);playerVisual=mix(playerVisual,playerLane,Math.min(1,dt*12));if(jumpClock>0)jumpClock=Math.max(0,jumpClock-dt);updateParticles(dt);if(state==='RUN'){runClock+=dt;const durations=[0,11,10,9];const duration=phase==='rno'?10:durations[current?.level||1];gateDist-=dt/duration;
 if(calm&&gateDist<=.16){gateDist=.16;state='SAFE_WAIT';$('coach').classList.remove('hidden');sound(480,.09,'sine',.04)}else if(!calm&&gateDist<=0)commit();}
 else if(state==='SUCCESS'){animHold+=dt;if(animHold>=1.5){toastEl.classList.remove('visible');advance()}}
 if(toaster>0){toaster-=dt;if(toaster<=0)toastEl.classList.remove('visible')}}else{playerVisual=mix(playerVisual,playerLane,Math.min(1,dt*10));updateParticles(dt*.2)}render();requestAnimationFrame(tick)}
menu();requestAnimationFrame(tick);
